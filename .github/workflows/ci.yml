name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Static checks: typecheck + unit tests + lint.  Cheap and fast,
  # so this job runs on every push and blocks Vercel deploys via
  # the GitHub Deployments API check.
  # ────────────────────────────────────────────────────────────
  static:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `next build` and prisma generate aren't needed for tsc/vitest,
      # but `prisma generate` is - typecheck imports `@prisma/client`.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm test

      # Every week still has its audio. A narration change rebuilds the
      # manifest that all twenty weeks read, and a bad rebuild drops the weeks
      # it did not touch: they find no clip for any line and fall back to the
      # browser's speech synthesis, a robot voice, with the build green and the
      # manifest valid JSON. That shipped once (#535). This is the check that
      # would have stopped it, and it needs the base to spot a partial drop.
      - run: git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"
      - run: node scripts/audit-manifest-covers-course.mjs --base=FETCH_HEAD

      # Every line the product SPEAKS has a clip.
      #
      # The audit above compares week totals against the base, so it catches a
      # week collapsing. It does not catch a few lines per week going missing,
      # and that is the easy mistake to make: edit a shared spoken-line builder
      # (the boss read-out, a verdict lead) and every week's text changes, so
      # every hash changes, so every clip is orphaned. Four lines a week is far
      # under any percentage threshold and lands on the robot voice anyway.
      #
      # --check resolves every block the way the runtime does and exits 1 if a
      # single one has no recording. No API calls, no credits - it only looks
      # for files that should already be in the repo.
      - run: node scripts/elevenlabs-generate-narration.mjs --check

      # Every clip still says its last letter. Our own shaping used to delete
      # word-final consonants ("takes" -> "take"), silently, on 1,020 clips.
      #
      # Scoped to the weeks that have been brought up to standard, and it is a
      # RATCHET: add a week here in the same PR that re-records it, and from
      # then on that week can never regress. Unscoped it would fail on the
      # nineteen weeks still waiting their turn, block every PR, and get
      # switched off within a day - which is how this kind of check dies.
      - run: node scripts/audit-consonant-integrity.mjs --weeks=1,2

      # No em-dashes in anything a child reads. A standing owner rule, and an
      # easy one to break by accident - five had crept into the six engines
      # week 1 uses, and the only reason they were found is that one of them
      # happened to be in a screenshot. Comments are exempt; there are over a
      # thousand of those and none of them are read by a six-year-old.
      - run: node scripts/audit-no-em-dashes.mjs

      # Two things on screen together must not say the same thing. The
      # Raccoon reacted with "Capitals, numbers AND symbols all at once" and
      # the verdict printed under it said "Mix a capital, a number AND a
      # symbol" - a child heard the same list twice. The two lines live in
      # different fields a long way apart, so it is easy to write and hard
      # to see. Scoped to the weeks brought up to standard, like the
      # consonant audit, because 65 of these exist across the other weeks.
      - run: node scripts/audit-echoed-lines.mjs 1 2

      # The same screen must not say a STOCK PHRASE twice either. Owner,
      # 2026-10-17, on week 2's last boss question: "it said, if you are not
      # sure twice". The audit above could not hear it - it needs three shared
      # CONTENT words and drops stop words first, so "not sure" collapsed to
      # "sure". Lowering that threshold is the WRONG fix: at two words it
      # flags 40 of the 100 questions, nearly all of them teach lines
      # correctly naming what was at stake. This checks a curated list of
      # generic SET-UP phrases instead, leaving every subject noun free to
      # repeat. Same per-week ratchet: four remain in weeks 18, 19 and 20.
      - run: node scripts/audit-framing-echoes.mjs 1 2

      # Every lesson icon keeps a transparent margin. Owner, 2026-10-17: "All
      # emojis need to look full and complete. As you can see, this eye is cut
      # off." The art was fine; what made it fragile is that the icons are
      # trimmed hard to their ink, so 86 of 92 touched the canvas edge and any
      # container that clips could shave a flat slice off one. A margin means
      # tangency can never reach a clipping edge.
      - run: node scripts/pad-lesson-icons.mjs --check

  # ────────────────────────────────────────────────────────────
  # End-to-end tests against a real production build.  Slower than
  # the static job (production build + browser launch) so it runs
  # in parallel.
  # ────────────────────────────────────────────────────────────
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral Postgres for the run. Previously DATABASE_URL fell back to a
    # non-existent stub whenever the E2E_DATABASE_URL secret was unset, so
    # /api/test/seed could never connect (empty 500) and globalSetup always
    # failed before any spec ran.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algorithmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/algorithmx_test
      AUTH_SECRET: ci-stub-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3100
      E2E_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate

      # Apply the schema, then seed the catalogue the e2e fixtures need: the
      # cyber-heroes Product + week-1 CourseContent that /api/test/seed
      # verifies. Without this the seed endpoint 500s and globalSetup fails.
      - name: Set up test database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      # next/font/google downloads every face at BUILD time and caches it
      # under .next/cache. Nothing was caching that here, so every run
      # cold-fetched ~30 font files from Google and any single failure took
      # the whole build down before a test could run: six builds died that
      # way on 2026-09-23, one of them a production deploy. The key is the
      # official Next.js recipe, so a source change still rebuilds; only
      # the fetched fonts and the compiler cache carry over.
      - name: Cache the Next build cache (fonts live here)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Build once; the playwright config boots `next start` itself.
      - name: Build production bundle
        run: npm run build || (echo "next build failed once (usually the next/font/google fetch flake); retrying" && npm run build)

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
