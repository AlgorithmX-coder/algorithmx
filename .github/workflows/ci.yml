name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Static checks: typecheck + unit tests + lint.  Cheap and fast,
  # so this job runs on every push and blocks Vercel deploys via
  # the GitHub Deployments API check.
  # ────────────────────────────────────────────────────────────
  static:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `next build` and prisma generate aren't needed for tsc/vitest,
      # but `prisma generate` is - typecheck imports `@prisma/client`.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm test

  # ────────────────────────────────────────────────────────────
  # End-to-end tests against a real production build.  Slower than
  # the static job (production build + browser launch) so it runs
  # in parallel.
  # ────────────────────────────────────────────────────────────
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npx prisma generate

      # Build once; the playwright config will boot `next start` itself.
      - name: Build production bundle
        run: npm run build
        env:
          # Build doesn't need a real database, but next-auth complains
          # without these.  Real values are injected on Vercel.
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          AUTH_SECRET: ci-stub-secret
          NEXTAUTH_URL: http://localhost:3100

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # NB: real DATABASE_URL needs to come from a CI secret pointing
          # at a disposable test database. The /api/test/seed endpoint
          # creates the e2e user + course; it does not stand up a DB.
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgres://stub:stub@localhost:5432/stub' }}
          AUTH_SECRET: ci-stub-secret
          AUTH_TRUST_HOST: "true"
          NEXTAUTH_URL: http://localhost:3100
          E2E_TESTS: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
