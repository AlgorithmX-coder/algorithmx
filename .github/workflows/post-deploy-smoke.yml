name: Post-deploy smoke test

# Pings the prod /api/signup endpoint after every push to main with a
# real DB call. Catches schema-drift / DB-connection / Prisma-client
# mismatch issues that lint + tsc cannot. The launch-blocking signup
# bug we hit on 2026-05-10 would have failed this check 30s after the
# deploy went out, instead of being discovered by a customer.
#
# Strategy: POST a SENTINEL email that already exists in prod. The route
# validates the payload, then does `prisma.user.findUnique` and answers
# 400 "Email already in use" - so a pass still proves the DB round-trip
# works, while writing nothing. The previous version sent a unique email
# per run and relied on a cleanup endpoint that was never built, which
# left 450 permanent ci-smoke users in production between May and Oct
# 2026. Never reintroduce a per-run email here.
#
# If the sentinel is ever deleted (e.g. a cleanup of ci-smoke rows), the
# next run answers 201 and recreates it - one row, self-healing.

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  smoke:
    name: Hit /api/signup on prod
    runs-on: ubuntu-latest
    # Wait long enough for Vercel to finish a fresh build before we ping
    # - typical build is ~90s, we give 4 minutes of headroom.
    steps:
      - name: Wait for Vercel to deploy
        run: sleep 240

      - name: Ping signup endpoint
        id: signup
        env:
          # Defaults to the prod domain. Override via repo secrets/vars
          # if your prod URL is different.
          PROD_URL: ${{ vars.PROD_URL || 'https://algorithmx.io' }}
          # Fixed, non-routable address. One row in prod, reused forever.
          EMAIL: ci-smoke-sentinel@algorithmx-ci.invalid
        run: |
          set -e
          BODY=$(cat <<EOF
          {"name":"CI Smoke","email":"${EMAIL}","password":"CiSmoke1!"}
          EOF
          )
          echo "POST ${PROD_URL}/api/signup with sentinel ${EMAIL}"
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST "${PROD_URL}/api/signup" \
            -H "Content-Type: application/json" \
            --data "${BODY}")
          RESPONSE=$(cat /tmp/body.txt)
          echo "HTTP status: ${STATUS}"
          echo "Body: ${RESPONSE}"

          # 5xx means the server or its DB connection is broken.
          if [ "${STATUS}" -ge 500 ]; then
            echo "::error::Signup endpoint returned ${STATUS} - deploy is broken. Body: ${RESPONSE}"
            exit 1
          fi

          # Steady state: the sentinel exists, so the route read the DB and
          # rejected the duplicate. That rejection IS the proof of life.
          if [ "${STATUS}" = "400" ]; then
            case "${RESPONSE}" in
              *"Email already in use"*)
                echo "DB round-trip confirmed (sentinel already present)."
                echo "smoke=ok" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            # Any OTHER 400 is a payload rejection that happens BEFORE the
            # DB is touched, so it proves nothing about the database.
            echo "::error::400 from /api/signup, but not the duplicate-email path, so the DB was never reached. Body: ${RESPONSE}"
            exit 1
          fi

          # First run after the sentinel was purged: it gets recreated.
          if [ "${STATUS}" = "201" ]; then
            echo "::notice::Sentinel user was missing and has been recreated. DB write confirmed."
            echo "smoke=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unexpected status ${STATUS} from /api/signup. Body: ${RESPONSE}"
          exit 1
